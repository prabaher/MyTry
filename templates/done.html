<!DOCTYPE html>
<html>
<head>
    <title>Feedback Submitted</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #020617, #080b4f);
            font-family: Arial, sans-serif;
        }

        .success-box {
            width: 420px;
            padding: 45px;
            text-align: center;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            color: white;
        }

        .check {
            font-size: 65px;
            margin-bottom: 15px;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #cbd5e1;
        }

        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: white;
            color: #111827;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .back-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div class="success-box">

        <div class="check">✅</div>

        <h1>Feedback Submitted!</h1>

        <p>Thank you for sharing your valuable feedback.</p>

        <p>Your feedback has been recorded successfully.</p>
    </div>

</body>
</html>
